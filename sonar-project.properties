sonar.projectKey=kinetix-frontend
sonar.projectName=Kinetix frontend
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx

sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx
sonar.exclusions=node_modules/**,.expo/**,android/**,ios/**,web-build/**,dist/**,coverage/**,.scannerwork/**,expo-env.d.ts
